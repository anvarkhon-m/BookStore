server:
  port: 8080
spring:
  application:
    name: 'BookStore'
  jpa:
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore
    username: root
    password: passwd
    driver-class-name: org.postgresql.Driver
  data:
    jdbc:
      dialect: postgresql